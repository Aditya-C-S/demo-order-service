name: Demo Order Service CI/CD Pipeline

on:
  push:
    branches: [ main, demo, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      demo_run_id:
        description: 'Active Demo Run ID from CI/CD Predictor Dashboard'
        required: false
        default: 'demo_run_manual'
      failure_stage:
        description: 'Failure injection stage: none, dependency, syntax, pytest'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - dependency
          - syntax
          - pytest
      inject_failure:
        description: 'Legacy switch: Inject controlled validation failure (1=yes, 0=no)'
        required: false
        default: '0'

jobs:
  test-and-predict:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Capture & Stream Checkpoint 25% (Runner Environment Initialization)
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/ci_logs
          LOG_FILE="/tmp/ci_logs/01_env.log"
          {
            echo "##[group]Runner Environment Initialization"
            echo "OS: $(uname -srmo 2>/dev/null || echo 'Ubuntu Linux')"
            echo "Runner Kernel: $(uname -v 2>/dev/null || echo 'Linux')"
            echo "Python Path: $(which python3 || echo '/usr/bin/python3')"
            echo "Python Version: $(python3 --version 2>&1)"
            echo "Git Version: $(git --version 2>&1)"
            echo "Commit: ${COMMIT_SHA}"
            echo "Commit Summary: $(git log -1 --oneline 2>/dev/null || echo 'Demo commit')"
            echo "Workflow Dispatch Run ID: ${DEMO_RUN_ID}"
            echo "##[endgroup]"
          } 2>&1 | tee "$LOG_FILE"

          python3 scripts/report_checkpoint.py \
            --depth 25 \
            --step-name "Runner Environment Initialization" \
            --stage "setup" \
            --step-outcome "success" \
            --exit-code 0 \
            --log-file "$LOG_FILE"

      - name: 4. Install Dependencies
        id: install_step
        env:
          FAILURE_STAGE: ${{ inputs.failure_stage || 'none' }}
        run: |
          mkdir -p /tmp/ci_logs
          LOG_FILE="/tmp/ci_logs/02_install.log"
          rm -f "$LOG_FILE"

          echo "=== Stage: Dependency Installation & Package Resolution ===" | tee -a "$LOG_FILE"

          if [ "$FAILURE_STAGE" = "dependency" ]; then
            echo "--- [Controlled Demo Injection] Simulating dependency resolution failure ---" | tee -a "$LOG_FILE"
            pip install --no-cache-dir "demo-unresolved-dependency-pkg==99.99.99" 2>&1 | tee -a "$LOG_FILE"
            PIP_INSTALL_EC=${PIPESTATUS[0]}
            echo "##[error] Requirements installation failed with exit code $PIP_INSTALL_EC" | tee -a "$LOG_FILE"

            # Stream in-flight early failure telemetry BEFORE final command exit
            python3 scripts/report_checkpoint.py \
              --depth 50 \
              --step-name "Install Dependencies (In-Flight Telemetry)" \
              --stage "build" \
              --step-outcome "running" \
              --log-file "$LOG_FILE" || true

            sleep 2
            exit $PIP_INSTALL_EC
          fi

          echo "--- [1/2] Upgrading pip ---" | tee -a "$LOG_FILE"
          python -m pip install --upgrade pip 2>&1 | tee -a "$LOG_FILE"
          PIP_UPGRADE_EC=${PIPESTATUS[0]}
          if [ $PIP_UPGRADE_EC -ne 0 ]; then
            echo "##[error] Pip upgrade failed with exit code $PIP_UPGRADE_EC" | tee -a "$LOG_FILE"
            exit $PIP_UPGRADE_EC
          fi

          echo "--- [2/2] Installing dependencies from requirements.txt ---" | tee -a "$LOG_FILE"
          pip install -r requirements.txt 2>&1 | tee -a "$LOG_FILE"
          PIP_INSTALL_EC=${PIPESTATUS[0]}
          if [ $PIP_INSTALL_EC -ne 0 ]; then
            echo "##[error] Requirements installation failed with exit code $PIP_INSTALL_EC" | tee -a "$LOG_FILE"
            exit $PIP_INSTALL_EC
          fi

          echo "--- Installed packages summary ---" | tee -a "$LOG_FILE"
          pip list --format=freeze | grep -E 'pytest|pydantic|requests|fastapi' | tee -a "$LOG_FILE" || pip list --format=freeze | head -n 10 | tee -a "$LOG_FILE"
          echo "Dependency installation completed successfully." | tee -a "$LOG_FILE"

      - name: 5. Stream Checkpoint 50% (Dependency Resolution Logs)
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          STEP_OUTCOME: ${{ steps.install_step.outcome }}
        run: |
          if [ "$STEP_OUTCOME" = "success" ]; then
            EXIT_ARGS="--exit-code 0"
          elif [ "$STEP_OUTCOME" = "failure" ]; then
            EXIT_ARGS="--exit-code 1"
          else
            EXIT_ARGS=""
          fi

          python3 scripts/report_checkpoint.py \
            --depth 50 \
            --step-name "Install Dependencies" \
            --stage "build" \
            $EXIT_ARGS \
            --step-outcome "$STEP_OUTCOME" \
            --log-file /tmp/ci_logs/02_install.log \
            --fallback-msg "=== Stage: Dependency Installation === Outcome: ${STEP_OUTCOME}"

      - name: 6. Validate Environment & Package Syntax
        id: syntax_check
        env:
          FAILURE_STAGE: ${{ inputs.failure_stage || 'none' }}
        run: |
          mkdir -p /tmp/ci_logs
          LOG_FILE="/tmp/ci_logs/03_syntax.log"
          rm -f "$LOG_FILE"

          echo "=== Stage: Environment & Static Validation ===" | tee -a "$LOG_FILE"

          if [ "$FAILURE_STAGE" = "syntax" ]; then
            echo "--- [Controlled Demo Injection] Simulating Python syntax and module validation failure ---" | tee -a "$LOG_FILE"
            python -c "eval('def invalid_syntax(: pass')" 2>&1 | tee -a "$LOG_FILE"
            SYNTAX_EC=${PIPESTATUS[0]}
            echo "##[error] Static validation and import check failed with exit code $SYNTAX_EC" | tee -a "$LOG_FILE"

            # Stream in-flight early failure telemetry BEFORE final command exit
            python3 scripts/report_checkpoint.py \
              --depth 75 \
              --step-name "Validate Environment (In-Flight Telemetry)" \
              --stage "build" \
              --step-outcome "running" \
              --log-file "$LOG_FILE" || true

            sleep 2
            exit $SYNTAX_EC
          fi

          python -c "import src.config, src.exceptions, src.validator, src.processor, src.order_service; print('All core modules imported and syntax verified successfully.')" 2>&1 | tee -a "$LOG_FILE"
          SYNTAX_EC=${PIPESTATUS[0]}
          if [ $SYNTAX_EC -ne 0 ]; then
            echo "##[error] Static validation and import check failed with exit code $SYNTAX_EC" | tee -a "$LOG_FILE"
            exit $SYNTAX_EC
          fi

      - name: 7. Stream Checkpoint 75% (Static Validation Logs)
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          STEP_OUTCOME: ${{ steps.syntax_check.outcome }}
        run: |
          if [ "$STEP_OUTCOME" = "success" ]; then
            EXIT_ARGS="--exit-code 0"
          elif [ "$STEP_OUTCOME" = "failure" ]; then
            EXIT_ARGS="--exit-code 1"
          else
            EXIT_ARGS=""
          fi

          python3 scripts/report_checkpoint.py \
            --depth 75 \
            --step-name "Validate Environment" \
            --stage "build" \
            $EXIT_ARGS \
            --step-outcome "$STEP_OUTCOME" \
            --log-file /tmp/ci_logs/03_syntax.log \
            --fallback-msg "=== Stage: Static Validation === Outcome: ${STEP_OUTCOME}"

      - name: 8. Execute Pytest Test Suite
        id: run_tests
        env:
          FAILURE_STAGE: ${{ inputs.failure_stage || 'none' }}
          INJECT_FAILURE_INPUT: ${{ inputs.inject_failure || '0' }}
        run: |
          mkdir -p /tmp/ci_logs
          LOG_FILE="/tmp/ci_logs/04_pytest.log"
          rm -f "$LOG_FILE"

          echo "=== Stage: Pytest Test Suite Execution ===" | tee -a "$LOG_FILE"

          if [ "$FAILURE_STAGE" = "pytest" ] || [ "$INJECT_FAILURE_INPUT" = "1" ]; then
            export INJECT_DEMO_FAILURE=1
            echo "--- [Controlled Demo Injection] INJECT_DEMO_FAILURE=1 active for pytest ---" | tee -a "$LOG_FILE"
          else
            export INJECT_DEMO_FAILURE=0
          fi

          pytest tests/ -v --tb=short 2>&1 | tee -a "$LOG_FILE"
          TEST_EC=${PIPESTATUS[0]}
          if [ $TEST_EC -ne 0 ]; then
            echo "##[error] Pytest test suite failed with exit code $TEST_EC" | tee -a "$LOG_FILE"

            # Stream in-flight early failure telemetry BEFORE final command exit
            python3 scripts/report_checkpoint.py \
              --depth 100 \
              --step-name "Execute Pytest (In-Flight Telemetry)" \
              --stage "test" \
              --step-outcome "running" \
              --log-file "$LOG_FILE" || true

            sleep 2
            exit $TEST_EC
          fi

      - name: 9. Stream Checkpoint 100% Final & Trigger Parser V2 / RCA
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          INSTALL_OUTCOME: ${{ steps.install_step.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax_check.outcome }}
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            EXIT_ARGS="--exit-code 0"
          elif [ "$TEST_OUTCOME" = "failure" ]; then
            EXIT_ARGS="--exit-code 1"
          else
            EXIT_ARGS=""
          fi

          if [ "$INSTALL_OUTCOME" = "failure" ] || [ "$SYNTAX_OUTCOME" = "failure" ] || [ "$TEST_OUTCOME" = "failure" ]; then
            WORKFLOW_OUTCOME="failure"
          elif [ "$TEST_OUTCOME" = "success" ]; then
            WORKFLOW_OUTCOME="success"
          else
            WORKFLOW_OUTCOME="failure"
          fi

          python3 scripts/report_checkpoint.py \
            --depth 100 \
            --step-name "Run Test Suite" \
            --stage "test" \
            $EXIT_ARGS \
            --step-outcome "$TEST_OUTCOME" \
            --workflow-outcome "$WORKFLOW_OUTCOME" \
            --is-final \
            --log-file /tmp/ci_logs/04_pytest.log \
            --fallback-msg "Pytest execution outcome: ${TEST_OUTCOME} (workflow outcome: ${WORKFLOW_OUTCOME})"
