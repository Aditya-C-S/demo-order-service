name: Demo Order Service CI/CD Pipeline

on:
  push:
    branches: [ main, demo, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      demo_run_id:
        description: 'Active Demo Run ID from CI/CD Predictor Dashboard'
        required: false
        default: 'demo_run_manual'
      inject_failure:
        description: 'Inject controlled validation failure (1=yes, 0=no)'
        required: false
        default: '0'

jobs:
  test-and-predict:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Capture & Stream Checkpoint 25% (Runner Environment Initialization)
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/ci_logs
          {
            echo "##[group]Runner Environment Initialization"
            echo "OS: $(uname -srmo 2>/dev/null || echo 'Ubuntu Linux')"
            echo "Runner Kernel: $(uname -v 2>/dev/null || echo 'Linux')"
            echo "Python Path: $(which python3 || echo '/usr/bin/python3')"
            echo "Python Version: $(python3 --version 2>&1)"
            echo "Git Version: $(git --version 2>&1)"
            echo "Commit: ${COMMIT_SHA}"
            echo "Commit Summary: $(git log -1 --oneline 2>/dev/null || echo 'Demo commit')"
            echo "##[endgroup]"
          } | tee /tmp/ci_logs/01_env.log

          echo "Reporting Checkpoint 25% to ${BACKEND_URL}/api/demo/runs/${DEMO_RUN_ID}/logs..."
          python3 -c "
import json, urllib.request, os
url = '${BACKEND_URL}/api/demo/runs/${DEMO_RUN_ID}/logs'
with open('/tmp/ci_logs/01_env.log', 'r', encoding='utf-8', errors='replace') as f:
    content = f.read()
payload = {
    'log_chunk': content,
    'step_name': 'Runner Environment Initialization',
    'stage': 'setup',
    'is_final': False,
    'exit_code': 0,
    'ci_run_id': '${GHA_RUN_ID}',
    'depth': 25
}
headers = {'Content-Type': 'application/json'}
if '${API_KEY}':
    headers['X-API-Key'] = '${API_KEY}'
req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
try:
    with urllib.request.urlopen(req, timeout=15) as resp:
        print('HTTP Status:', resp.status)
except Exception as e:
    print('Delivery warning:', e)
"

      - name: 4. Install Dependencies
        id: install_step
        run: |
          mkdir -p /tmp/ci_logs
          {
            echo "=== Stage: Dependency Installation & Package Resolution ==="
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            echo "Installed packages summary:"
            pip list --format=freeze | grep -E 'pytest|pydantic|requests|fastapi' || pip list --format=freeze | head -n 10
            echo "Process completed successfully."
          } 2>&1 | tee /tmp/ci_logs/02_install.log
          exit ${PIPESTATUS[0]}

      - name: 5. Stream Checkpoint 50% (Dependency Resolution Logs)
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          STEP_OUTCOME: ${{ steps.install_step.outcome }}
        run: |
          EXIT_CODE=$([ "$STEP_OUTCOME" = "success" ] && echo 0 || echo 1)
          python3 -c "
import json, urllib.request, os
url = '${BACKEND_URL}/api/demo/runs/${DEMO_RUN_ID}/logs'
log_file = '/tmp/ci_logs/02_install.log'
content = ''
if os.path.exists(log_file):
    with open(log_file, 'r', encoding='utf-8', errors='replace') as f:
        content = f.read()
if not content.strip():
    content = '=== Stage: Dependency Installation ===
Outcome: ${STEP_OUTCOME}
'
payload = {
    'log_chunk': content,
    'step_name': 'Install Dependencies',
    'stage': 'build',
    'is_final': False,
    'exit_code': int('${EXIT_CODE}'),
    'ci_run_id': '${GHA_RUN_ID}',
    'depth': 50
}
headers = {'Content-Type': 'application/json'}
if '${API_KEY}':
    headers['X-API-Key'] = '${API_KEY}'
req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
try:
    with urllib.request.urlopen(req, timeout=15) as resp:
        print('HTTP Status:', resp.status)
except Exception as e:
    print('Delivery warning:', e)
"

      - name: 6. Validate Environment & Package Syntax
        id: syntax_check
        run: |
          mkdir -p /tmp/ci_logs
          {
            echo "=== Stage: Environment & Static Validation ==="
            python -c "import src.config, src.exceptions, src.validator, src.processor, src.order_service; print('All core modules imported and syntax verified successfully.')"
          } 2>&1 | tee /tmp/ci_logs/03_syntax.log
          exit ${PIPESTATUS[0]}

      - name: 7. Stream Checkpoint 75% (Static Validation Logs)
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          STEP_OUTCOME: ${{ steps.syntax_check.outcome }}
        run: |
          EXIT_CODE=$([ "$STEP_OUTCOME" = "success" ] && echo 0 || echo 1)
          python3 -c "
import json, urllib.request, os
url = '${BACKEND_URL}/api/demo/runs/${DEMO_RUN_ID}/logs'
log_file = '/tmp/ci_logs/03_syntax.log'
content = ''
if os.path.exists(log_file):
    with open(log_file, 'r', encoding='utf-8', errors='replace') as f:
        content = f.read()
if not content.strip():
    content = '=== Stage: Static Validation ===
Outcome: ${STEP_OUTCOME}
'
payload = {
    'log_chunk': content,
    'step_name': 'Validate Environment',
    'stage': 'build',
    'is_final': False,
    'exit_code': int('${EXIT_CODE}'),
    'ci_run_id': '${GHA_RUN_ID}',
    'depth': 75
}
headers = {'Content-Type': 'application/json'}
if '${API_KEY}':
    headers['X-API-Key'] = '${API_KEY}'
req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
try:
    with urllib.request.urlopen(req, timeout=15) as resp:
        print('HTTP Status:', resp.status)
except Exception as e:
    print('Delivery warning:', e)
"

      - name: 8. Execute Pytest Test Suite
        id: run_tests
        env:
          INJECT_DEMO_FAILURE: ${{ inputs.inject_failure || '0' }}
        run: |
          mkdir -p /tmp/ci_logs
          pytest tests/ -v --tb=short 2>&1 | tee /tmp/ci_logs/04_pytest.log
          exit ${PIPESTATUS[0]}

      - name: 9. Stream Checkpoint 100% Final & Trigger Parser V2 / RCA
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
          DEMO_RUN_ID: ${{ inputs.demo_run_id || secrets.DEMO_RUN_ID || 'demo_run_manual' }}
          GHA_RUN_ID: ${{ github.run_id }}
          API_KEY: ${{ secrets.DEMO_API_KEY }}
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          EXIT_CODE=$([ "$TEST_OUTCOME" = "success" ] && echo 0 || echo 1)
          python3 -c "
import json, urllib.request, os
url = '${BACKEND_URL}/api/demo/runs/${DEMO_RUN_ID}/logs'
log_file = '/tmp/ci_logs/04_pytest.log'
content = ''
if os.path.exists(log_file):
    with open(log_file, 'r', encoding='utf-8', errors='replace') as f:
        content = f.read()
if not content.strip():
    content = 'Pytest execution completed with exit code ${EXIT_CODE}
'
payload = {
    'log_chunk': content,
    'step_name': 'Run Test Suite',
    'stage': 'test',
    'is_final': True,
    'exit_code': int('${EXIT_CODE}'),
    'ci_run_id': '${GHA_RUN_ID}',
    'depth': 100
}
headers = {'Content-Type': 'application/json'}
if '${API_KEY}':
    headers['X-API-Key'] = '${API_KEY}'
req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
try:
    with urllib.request.urlopen(req, timeout=15) as resp:
        print('HTTP Status:', resp.status)
except Exception as e:
    print('Delivery warning:', e)
"
